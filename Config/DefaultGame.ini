[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=76AA4A358243299859035E9BCF745E81

; ---------------------------------------------------------------------------
; Asset Manager: a entrada de GameFeatureData que o plugin Game Features cobra ao
; abrir o editor ("Asset Manager settings do not include an entry for assets of type
; GameFeatureData, which is required for game feature plugins to function").
;
; O plugin GameFeatures entra carregado pelos toolsets (GameFeaturesToolset, via
; MCPClientToolset/AllToolsets) e, sem esta regra, registra um erro em LoadErrors.
; Esta entrada e EXATAMENTE a que o botao "Add entry to PrimaryAssetTypesToScan?" do
; proprio editor grava (GameFeaturesEditorModule::AddDefaultGameDataRule).
;
; O projeto ainda nao usa game features: quando usar, cada plugin de feature declara as
; proprias pastas de varredura, entao aqui nao ha Directory nenhum de proposito.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass=/Script/GameFeatures.GameFeatureData,bHasBlueprintClasses=False,bIsEditorOnly=False,Rules=(CookRule=AlwaysCook))

